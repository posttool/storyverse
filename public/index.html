<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Saga Studio</title>

  <!-- App Styling  & components -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&family=Inter:wght@400;700&family=Lato:wght@400;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
</head>

<body>
  <div id="root">
    <div class="row" style="margin: 0 0 20px 0;">
      <div class="col1" style="width:200px">
        <div id="logo">
          Saga Studio
        </div>
      </div>
      <div class="col2" style="width:80%">
      </div>
      <div class="col3">
        <div id="account"></div>
      </div>
    </div>
    <div id="not-logged-in">
      <img src="img/logo1.png" width="100%">
      <div class="title">Make &amp; mix stories by playing with shapes</div>
      <img src="img/sign-in-with-google.png" id="not-logged-in-sign-in">
    </div>
    <div id="info-panel">
      <div class="row" >
        <div id="main-tabs"></div>
      </div>
      <div class="row workspace" >
        <div class="col1" style="min-width: 450px;">
          <div id="picker"></div>
          <div id="editor"></div>
        </div>
        <div class="col2" >
          <div id="preview"></div>
          <div id="preview2"></div>
        </div>
      </div>
    </div>
  </div>
</body>
<script src="js/main.js"></script>

</html>
