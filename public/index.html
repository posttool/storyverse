<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Storyverser</title>

    <!-- update the version number as needed -->
    <script defer src="/__/firebase/10.0.0/firebase-app-compat.js"></script>
    <!-- include only the Firebase features as you need -->
    <script defer src="/__/firebase/10.0.0/firebase-auth-compat.js"></script>
    <script defer src="/__/firebase/10.0.0/firebase-firestore-compat.js"></script>
    <script defer src="/__/firebase/10.0.0/firebase-functions-compat.js"></script>
    <script defer src="/__/firebase/10.0.0/firebase-storage-compat.js"></script>
    <script defer src="/__/firebase/10.0.0/firebase-analytics-compat.js"></script>
    <!-- 
      initialize the SDK after all desired features are loaded, set useEmulator to false
      to avoid connecting the SDK to running emulators.
    -->
    <script defer src="/__/firebase/init.js?useEmulator=true"></script>

     <!-- App Styling  & components -->
     <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
     <link rel="preconnect" href="https://fonts.googleapis.com">
     <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
     <link rel="stylesheet"
         href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
     <link rel="preconnect" href="https://fonts.googleapis.com">
     <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
     <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
     <link rel="stylesheet" href="css/main.css">
 </head>
 
 <body>
     <div id="instruction">Drag stuff into the stage. Tap done to continue.</div>
     <div id="root">
         <div class="col1">
             <div id="stage" class="window">
                 <div class="header">
                     <div class="left">
                         Stage <button class="green" id="button-done" onclick="showTimeline()">Done</button>
                     </div>
                     <div class="right">
                         Storytelling framework
                         <select onchange="change_framework(this)">
                             <option>Select</option>
                             <option>Tragedy</option>
                             <option>Mystery</option>
                             <option>Coming of Age</option>
                             <option>The Hero's Journey</option>
                             <option>Comedy</option>
                             <option>Epic</option>
                         </select>
                     </div>
                 </div>
                 <div id="stage-body" class="window-body bigpad">
                     <div>
                         Character(s)
                         <div class="character-body">
                             <div class="place" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
                             <div class="place" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
                             <div class="place" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
                         </div>
                     </div>
                     <div style="padding-left: 20px;">
                         Setting(s)
                         <div class="setting-body">
                             <div class="placesq" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
                             <div class="placesq" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
                         </div>
                     </div>
                 </div>
             </div>
             <div id="stuff" class="window">
                 <div class="header">
                     <div class="left">
                         MyGPT stuff
                     </div>
                 </div>
                 <div id="stuff-body" class="window-body">
 
                 </div>
             </div>
         </div>
         <div class="col2">
             <div id="story" class="window">
                 <div class="header">
                     <div class="left">
                         My story
                     </div>
                 </div>
                 <div id="story-body" class="window-body">
 
                 </div>
             </div>
         </div>
     </div>
 </body>
 <script src="js/scrapbook.js"></script>
 <script src="js/main.js"></script>

</html>
